[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SEED_DEMO = "false"
  SHOW_DEV_LOGINS = "false"
  # Server env + embedded-postgres binaries cause widespread false positives in Netlify secrets scan.
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
